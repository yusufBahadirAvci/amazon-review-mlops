# Pre-commit hooks for the product-review-classifier (Python).
# Setup:   pip install pre-commit && pre-commit install (with .venv activated)
# Run all: pre-commit run --all-files
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # General hygiene, YAML syntax and large-file guard
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
        # Windows batch scripts must keep CRLF
        exclude: \.cmd$
      - id: check-yaml
        # Allow multi-document files (e.g. Kubernetes / Helm manifests)
        args: [--allow-multiple-documents]
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      # Block files > 5MB; datasets and model binaries must be tracked with DVC
      - id: check-added-large-files
        args: [--maxkb=5120]

  # Python lint (with autofix) and formatting; keep rev in sync with ruff in requirements.txt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Test suite; runs pytest from the active virtual environment
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false
        types: [python]
