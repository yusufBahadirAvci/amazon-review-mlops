spring.application.name=product-review-classifier

# Load the same .env that docker-compose uses (when run from the project root); real env vars still take precedence
spring.config.import=optional:file:.env[.properties]

# PostgreSQL (docker-compose service "postgres-db").
# Uses the same variable names as .env; the defaults match the local docker-compose setup.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:amazon_reviews_db}
spring.datasource.username=${POSTGRES_USER:mlops_user}
spring.datasource.password=${POSTGRES_PASSWORD:mlops_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Saved Amazon pages are often larger than the 1MB default
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Crawler (bound to CrawlerProperties). Keep in sync with src/test/resources/application.properties.
crawler.user-agent=ProductReviewClassifier/1.0 (academic review crawler)
crawler.timeout-ms=15000
crawler.delay-ms=2000
crawler.max-reviews-per-run=100
crawler.selectors.review=[data-hook=review]
crawler.selectors.rating=[data-hook=review-star-rating] .a-icon-alt, [data-hook=cmps-review-star-rating] .a-icon-alt
crawler.selectors.title=[data-hook=review-title]
crawler.selectors.text=[data-hook=review-body]
crawler.selectors.date=[data-hook=review-date]
