# Replaces src/main/resources/application.properties during tests: in-memory H2 instead of PostgreSQL.
spring.application.name=product-review-classifier-test

spring.datasource.url=jdbc:h2:mem:reviews;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Same crawler settings as main; this file shadows the main one, so they must be repeated here.
crawler.user-agent=ProductReviewClassifier/1.0 (test)
crawler.timeout-ms=15000
crawler.delay-ms=2000
crawler.max-reviews-per-run=100
crawler.selectors.review=[data-hook=review]
crawler.selectors.rating=[data-hook=review-star-rating] .a-icon-alt, [data-hook=cmps-review-star-rating] .a-icon-alt
crawler.selectors.title=[data-hook=review-title]
crawler.selectors.text=[data-hook=review-body]
crawler.selectors.date=[data-hook=review-date]
